<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진흥측량설계공사 | 포천 측량·설계·부동산 컨설팅</title>
<meta name="description" content="경기도 포천시 진흥측량설계공사 - 토지 측량, 건축 관련 설계, 부동산 컨설팅 전문 업체입니다.">
<meta property="og:title" content="진흥측량설계공사">
<meta property="og:description" content="경기도 포천시 진흥측량설계공사 - 토지 측량, 건축 관련 설계, 부동산 컨설팅 전문 업체입니다.">
<meta property="og:image" content="hero.jpg">
<meta property="og:type" content="website">
<link rel="canonical" href="https://jinheung1996.co.kr/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B3A;
    --paper:#FFFFFF;
    --contour:#A9B8A0;
    --amber:#D9932E;
    --slate:#5C6670;
    --line:#E7E2D6;
    --brand-red:#A13D2E;
    --brand-red-tint:#F4E2DD;
    --max-width: 1280px;
    --nav-height: 78px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    line-height:1.6;
  }
  h1,h2,h3{
    font-family:'Space Grotesk','Noto Sans KR',sans-serif;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:0.75rem;
    color:var(--slate);
  }
  a{color:inherit;}
  section{scroll-margin-top:var(--nav-height);}
  [id^="field-"]{scroll-margin-top:var(--nav-height);}

  /* ---------- Top navigation bar (fixed, transparent -> solid) ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:200;
    border-bottom:1px solid transparent;
    transition:background .3s ease, border-color .3s ease;
  }
  .topbar-inner{
    max-width:var(--max-width);
    margin:0 auto;
    padding:20px 6vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:1.25rem;
    color:#fff;
    text-decoration:none;
    transition:color .3s ease;
  }
  .logo .brand-red{color:var(--brand-red);}
  .logo-mark{width:36px;height:36px;flex:none;}

  .nav-tabs{display:flex; gap:38px; list-style:none; margin:0; padding:0;}
  .nav-tab{position:relative;}
  .nav-tab > a{
    color:#fff; text-decoration:none;
    font-weight:500; font-size:0.98rem;
    padding:10px 0; display:inline-block;
    transition:color .3s ease;
  }
  .submenu{
    position:absolute; top:100%; left:50%;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:8px 0; min-width:160px;
    box-shadow:0 14px 34px rgba(28,43,58,0.14);
    opacity:0; pointer-events:none;
    transform:translate(-50%,6px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .nav-tab:hover .submenu{opacity:1; pointer-events:auto; transform:translate(-50%,4px);}
  .submenu a{
    display:block; padding:10px 22px;
    font-size:0.9rem; color:var(--ink);
    text-decoration:none; white-space:nowrap;
  }
  .submenu a:hover{background:var(--brand-red-tint); color:var(--brand-red);}

  .topbar.scrolled{
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(8px);
    border-bottom-color:var(--line);
  }
  .topbar.scrolled .logo, .topbar.scrolled .nav-tab > a{color:var(--ink);}
  .topbar.scrolled .logo .brand-red{color:var(--brand-red);}

  /* ---------- Hero carousel ---------- */
  .hero-carousel{position:relative; height:100vh; min-height:560px; overflow:hidden;}
  .hero-slide{
    position:absolute; inset:0; opacity:0;
    transition:opacity 1.4s ease;
  }
  .hero-slide.active{opacity:1;}
  .hero-slide img{width:100%; height:100%; object-fit:cover;}
  .hero-overlay{position:absolute; inset:0; z-index:1; background:rgba(14,20,26,0.4);}
  .hero-text{
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; padding:0 6vw;
  }
  .hero-text h1{
    font-size:clamp(1.9rem,4.4vw,3.2rem);
    font-weight:700;
  }
  .hero-text p{
    margin-top:22px; font-size:1.05rem; line-height:1.9;
    max-width:680px; color:rgba(255,255,255,0.92);
  }

  /* ---------- Sections (shared) ---------- */
  .section-inner{
    max-width:var(--max-width);
    margin:0 auto;
    padding:96px 6vw;
  }
  .section-head{
    display:flex; align-items:baseline; gap:16px;
    margin-bottom:48px;
  }
  .section-head h2{font-size:1.7rem;}

  /* ---------- 기업소개 (사진+설명, 리빌 애니메이션) ---------- */
  .company-intro{border-bottom:1px solid var(--line);}
  .intro-flex{
    display:grid; grid-template-columns:1fr 1fr;
    gap:64px; align-items:center;
  }
  .intro-image img{
    width:100%; height:420px; object-fit:cover; border-radius:4px;
  }
  .intro-text h2{font-size:1.9rem; margin-bottom:22px;}
  .intro-text p{color:var(--slate); font-size:1.02rem; line-height:1.85;}

  .reveal{
    opacity:0; transform:translateY(38px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .reveal.visible{opacity:1; transform:translateY(0);}
  .reveal-delay{transition-delay:.15s;}

  /* ---------- 인사말 (틀만) ---------- */
  .greeting-text{color:var(--slate); font-size:1.02rem; line-height:1.9; max-width:720px;}

  /* ---------- 사업분야 ---------- */
  .field-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:28px;
  }
  .field-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:32px 26px;
    position:relative;
    box-shadow:0 2px 10px rgba(28,43,58,0.05);
  }
  .field-card .mono{margin-bottom:14px;}
  .field-card h3{font-size:1.15rem; margin-bottom:10px;}
  .field-card p{color:var(--slate); font-size:0.92rem; margin:0;}
  .field-card::before{
    content:"";
    position:absolute; left:26px; top:0;
    width:28px; height:3px; background:var(--amber);
  }

  /* ---------- 상담문의 + 오시는 길(지도) ---------- */
  .contact-map-wrap{
    display:grid; grid-template-columns:1fr 1.1fr; gap:64px;
  }
  .contact-box .mono{margin-bottom:10px;}
  .contact-box h2{font-size:1.6rem; margin-bottom:18px;}
  .contact-message{color:var(--slate); font-size:1rem; margin:0 0 24px;}
  .info-row{display:flex; gap:10px; margin-bottom:12px; font-size:1rem;}
  .info-row span.label{color:var(--slate); min-width:64px; display:inline-block;}
  .map-box h3{font-size:1.1rem; margin-bottom:14px;}
  .map-frame-wrap{
    width:100%; height:320px;
    border-radius:4px; overflow:hidden;
    border:1px solid var(--line);
  }
  .map-frame-wrap iframe{width:100%; height:100%; border:0;}

  /* ---------- Footer ---------- */
  footer{padding:40px 6vw 30px; border-top:1px solid var(--line); text-align:center;}
  .footer-inner{max-width:var(--max-width); margin:0 auto;}
  .footer-info{
    font-size:0.85rem; color:var(--slate); line-height:2; margin-bottom:18px;
    display:flex; flex-wrap:wrap; justify-content:center; gap:0 16px;
  }
  .footer-info span{margin-right:0;}
  .footer-copyright{
    font-size:0.8rem; color:var(--slate);
  }

  /* ---------- 맨 위로 버튼 ---------- */
  .to-top{
    position:fixed; right:26px; bottom:26px; z-index:150;
    width:50px; height:50px; border-radius:50%;
    background:var(--ink); color:#fff; border:none;
    font-size:1.3rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transform:translateY(12px);
    transition:opacity .25s ease, transform .25s ease, background .2s ease;
    box-shadow:0 6px 18px rgba(28,43,58,0.28);
  }
  .to-top:hover{background:var(--brand-red);}
  .to-top.show{opacity:1; pointer-events:auto; transform:translateY(0);}

  @media (max-width:760px){
    .nav-tabs{display:none;}
    .hero-carousel{height:80vh;}
    .intro-flex{grid-template-columns:1fr; gap:32px;}
    .intro-image img{height:260px;}
    .field-grid{grid-template-columns:1fr;}
    .contact-map-wrap{grid-template-columns:1fr; gap:40px;}
    .section-inner{padding:64px 6vw;}
    .logo{font-size:1.1rem;}
    .logo-mark{width:30px; height:30px;}
  }
</style>
</head>
<body>

<nav class="topbar" id="topbar">
  <div class="topbar-inner">
    <a href="#top" class="logo">
      <svg class="logo-mark" id="logoMark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="16" stroke="#1C2B3A" stroke-width="1.4"/>
        <circle cx="17" cy="17" r="11" stroke="#A9B8A0" stroke-width="1.2"/>
        <circle cx="17" cy="17" r="6" stroke="#D9932E" stroke-width="1.4"/>
        <line x1="17" y1="1" x2="17" y2="7" stroke="#1C2B3A" stroke-width="1.2"/>
        <line x1="17" y1="27" x2="17" y2="33" stroke="#1C2B3A" stroke-width="1.2"/>
        <line x1="1" y1="17" x2="7" y2="17" stroke="#1C2B3A" stroke-width="1.2"/>
        <line x1="27" y1="17" x2="33" y2="17" stroke="#1C2B3A" stroke-width="1.2"/>
      </svg>
      <img class="logo-mark" id="logoImage" style="display:none; object-fit:contain;" alt="로고">
      <span><span class="brand-red" id="companyNameRed"></span><span id="companyNameRest"></span></span>
    </a>
    <ul class="nav-tabs">
      <li class="nav-tab">
        <a href="#intro">회사소개</a>
        <div class="submenu">
          <a href="#intro">기업소개</a>
          <a href="#greeting">인사말</a>
          <a href="#contact">찾아오시는 길</a>
        </div>
      </li>
      <li class="nav-tab">
        <a href="#fields">사업분야</a>
        <div class="submenu">
          <a href="#field-land">토지관련</a>
          <a href="#field-architecture">건축관련</a>
          <a href="#field-consulting">부동산컨설팅</a>
        </div>
      </li>
      <li class="nav-tab">
        <a href="#contact">상담문의</a>
      </li>
    </ul>
  </div>
</nav>

<section class="hero-carousel" id="top">
  <div id="heroSlides"></div>
  <div class="hero-overlay"></div>
  <div class="hero-text">
    <h1><span id="heroTitleLine1"></span></h1>
    <p id="heroTitleLine2"></p>
  </div>
</section>

<section class="company-intro" id="intro">
  <div class="section-inner">
    <div class="intro-flex">
      <div class="intro-image reveal">
        <img id="introImage" alt="기업소개 사진">
      </div>
      <div class="intro-text reveal reveal-delay">
        <h2 id="introTitleLine1"></h2>
        <p id="introDescription"></p>
      </div>
    </div>
  </div>
</section>

<section id="greeting">
  <div class="section-inner">
    <div class="section-head">
      <span class="mono">Greeting</span>
      <h2>인사말</h2>
    </div>
    <p class="greeting-text" id="greetingText"></p>
  </div>
</section>

<section id="fields">
  <div class="section-inner">
    <div class="section-head">
      <span class="mono">Services</span>
      <h2>사업분야</h2>
    </div>
    <div class="field-grid" id="fieldGrid"></div>
  </div>
</section>

<section id="contact">
  <div class="section-inner">
    <div class="contact-map-wrap">
      <div class="contact-box">
        <span class="mono">Contact</span>
        <h2>상담문의</h2>
        <p class="contact-message" id="contactMessage"></p>
        <div class="info-row"><span class="label">전화</span><span id="contactPhone"></span></div>
        <div class="info-row"><span class="label">이메일</span><span id="contactEmail"></span></div>
      </div>
      <div class="map-box">
        <h3>오시는 길</h3>
        <div class="map-frame-wrap">
          <iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <p class="info-row" style="margin-top:14px;"><span class="label">주소</span><span id="contactAddress"></span></p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-info">
      <span id="footerCompanyName"></span>
      <span id="footerAddress"></span>
      <span id="footerCeo"></span>
      <span id="footerPhone"></span>
      <span id="footerEmail"></span>
    </div>
    <div class="footer-copyright" id="footerCopyright"></div>
  </div>
</footer>

<button class="to-top" id="toTopBtn" aria-label="맨 위로">↑</button>

<script src="content.js"></script>
<script>
  // 로고 / 회사명
  document.getElementById('companyNameRed').textContent = content.companyNamePrefix;
  document.getElementById('companyNameRest').textContent = content.companyNameRest;
  if (content.logoImage && content.logoImage.trim() !== "") {
    document.getElementById('logoImage').src = content.logoImage;
    document.getElementById('logoImage').style.display = 'block';
    document.getElementById('logoMark').style.display = 'none';
  }

  // 히어로 캐러셀 슬라이드 생성
  const heroSlidesEl = document.getElementById('heroSlides');
  content.heroImages.forEach((src, i) => {
    heroSlidesEl.insertAdjacentHTML('beforeend', `
      <div class="hero-slide${i === 0 ? ' active' : ''}">
        <img src="${src}" alt="측량 현장 ${i+1}">
      </div>
    `);
  });
  const slides = document.querySelectorAll('.hero-slide');
  let heroIndex = 0;
  if (slides.length > 1) {
    setInterval(() => {
      slides[heroIndex].classList.remove('active');
      heroIndex = (heroIndex + 1) % slides.length;
      slides[heroIndex].classList.add('active');
    }, 5000);
  }
  document.getElementById('heroTitleLine1').textContent = content.hero.titleLine1;
  document.getElementById('heroTitleLine2').innerHTML = content.hero.titleLine2.replace(/\n/g, '<br>');

  // 기업소개
  document.getElementById('introImage').src = content.companyIntro.image;
  document.getElementById('introTitleLine1').textContent = content.companyIntro.titleLine1;
  document.getElementById('introDescription').innerHTML = content.companyIntro.description.replace(/\n/g, '<br>');

  // 인사말
  document.getElementById('greetingText').innerHTML = content.greeting.text.replace(/\n/g, '<br>');

  // 사업분야
  const fieldGridEl = document.getElementById('fieldGrid');
  content.fields.forEach(field => {
    fieldGridEl.insertAdjacentHTML('beforeend', `
      <div class="field-card" id="field-${field.id}">
        <span class="mono">${field.tag}</span>
        <h3>${field.title}</h3>
        <p>${field.desc}</p>
      </div>
    `);
  });

  // 상담문의 + 지도
  document.getElementById('contactMessage').textContent = content.contact.message;
  document.getElementById('contactPhone').textContent = content.contact.phone;
  document.getElementById('contactEmail').textContent = content.contact.email;
  document.getElementById('contactAddress').textContent = content.contact.address;
  document.getElementById('mapFrame').src = 'https://www.google.com/maps?q=' + encodeURIComponent(content.contact.address) + '&output=embed';

  // 푸터
  document.getElementById('footerCompanyName').textContent = content.footer.companyName;
  document.getElementById('footerAddress').textContent = content.footer.address;
  document.getElementById('footerCeo').textContent = '대표 ' + content.footer.ceo;
  document.getElementById('footerPhone').textContent = content.footer.phone;
  document.getElementById('footerEmail').textContent = content.footer.email;
  document.getElementById('footerCopyright').textContent = content.footer.copyright;

  // 상단바: 스크롤하면 투명 -> 불투명 전환 + 맨 위로 버튼 표시
  const topbar = document.getElementById('topbar');
  const toTopBtn = document.getElementById('toTopBtn');
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    topbar.classList.toggle('scrolled', y > 40);
    toTopBtn.classList.toggle('show', y > 60);
  });
  toTopBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

  // 기업소개 영역 스크롤 리빌 애니메이션
  const revealEls = document.querySelectorAll('.reveal');
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.2 });
  revealEls.forEach(el => revealObserver.observe(el));
</script>

</body>
</html>
